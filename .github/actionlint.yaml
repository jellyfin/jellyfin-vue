# https://github.com/rhysd/actionlint/blob/main/docs/config.md
paths:
  .github/workflows/**/*.yml:
    ignore:
      # actionlint doesn't support GitHub's self-repository syntax yet: https://github.blog/changelog/2026-07-30-reference-same-repository-actions-with-self-repository-syntax/
      - 'reusable workflow call "\$/'
