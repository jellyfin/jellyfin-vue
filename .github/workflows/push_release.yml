name: Push & Release 🌍

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref }}
  cancel-in-progress: true

on:
  release:
    types:
      - released
      - prereleased
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'

permissions: {}

jobs:
  automation:
    name: Automation 🎛️
    if: ${{ github.repository == 'jellyfin/jellyfin-vue' }}
    uses: $/.github/workflows/__automation.yml
    permissions:
      contents: read
      pull-requests: write

  main:
    name: ${{ github.event_name == 'push' && 'Unstable 🚀⚠️' || 'Stable 🏷️✅' }}
    uses: $/.github/workflows/__package.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    # Inherited by the jobs of __package.yml (see the PERMISSIONS note there):
    # id-token, attestations and artifact-metadata are needed for attestation publication,
    # packages for pushing the Docker images to GHCR in docker_merge
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: read
      packages: write
    with:
      commit: ${{ github.event_name == 'push' && github.sha }}
      is_prerelease: ${{ github.event_name == 'release' && github.event.action == 'prereleased' }}
      tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name }}
      push: ${{ github.repository == 'jellyfin/jellyfin-vue' }}

  codeql:
    name: GitHub CodeQL 🔬
    uses: $/.github/workflows/__codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      commit: ${{ github.sha }}

  deploy:
    name: Deploy 🚀
    if: ${{ github.repository == 'jellyfin/jellyfin-vue' }}
    uses: $/.github/workflows/__deploy.yml
    needs:
      - main
    permissions:
      contents: read
      deployments: write
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JF_BOT_TOKEN: ${{ secrets.JF_BOT_TOKEN }}
    with:
      branch: ${{ github.ref_name }}
      comment: false
