# SECURITY: pull_request_target runs fork code automatically, in the base repository context
# (see https://gh.io/securely-using-pull_request_target). Jobs that check out and run PR code
# (build, quality_checks, codeql) must never get secrets, write permissions (other than codeql's
# security-events) or a write-capable cache-mode. The jobs that do get secrets (push-comment,
# deploy and the label/semantic checks) must never check out or run PR code.
#
# pull_request_target is used instead to simplify the workflow definitions and reduce duplication.
name: Pull Request 📥

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] see the SECURITY note above
  merge_group:

permissions: {}

jobs:
  push-comment:
    name: Create comments ✍️
    if: ${{ always() && !cancelled() && github.repository == 'jellyfin/jellyfin-vue' && github.event_name == 'pull_request_target' }}
    uses: $/.github/workflows/__job_messages.yml
    secrets:
      JF_BOT_TOKEN: ${{ secrets.JF_BOT_TOKEN }}
    with:
      commit: ${{ github.event.pull_request.head.sha }}
      in_progress: true
      comment: true

  automation:
    name: Automation 🎛️
    if: ${{ always() && !cancelled() && github.repository == 'jellyfin/jellyfin-vue' }}
    uses: $/.github/workflows/__automation.yml
    permissions:
      contents: read
      pull-requests: write

  pr-metadata:
    name: Pull Request metadata 📚🏷️
    if: ${{ always() && !cancelled() && github.repository == 'jellyfin/jellyfin-vue' }}
    runs-on: ubuntu-slim

    steps:
      - parallel:
          - name: Validate PR title 👌
            uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
            env:
              GITHUB_TOKEN: ${{ secrets.JF_BOT_TOKEN }}
            with:
              subjectPattern: ^(?![A-Z]).+$
              subjectPatternError: |
                The subject "{subject}" found in the pull request title "{title}"
                didn't match the configured pattern. Please ensure that the subject
                doesn't start with an uppercase character.

          - name: Label depending on modified files 🏷️
            uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
            with:
              sync-labels: true
              repo-token: ${{ secrets.JF_BOT_TOKEN }}

  build:
    name: Build 🏗️
    if: ${{ always() && !cancelled() }}
    uses: $/.github/workflows/__package.yml
    # Read-only on purpose: attestations and docker_merge, which need write permissions, are skipped for pull requests.
    # See the PERMISSIONS note in __package.yml
    permissions:
      contents: read
    with:
      commit: ${{ github.event.pull_request.head.sha }}

  quality_checks:
    name: Quality checks 👌🧪
    if: ${{ always() && !cancelled() }}
    uses: $/.github/workflows/__quality_checks.yml
    with:
      commit: ${{ github.event.pull_request.head.sha }}

  codeql:
    name: GitHub CodeQL 🔬
    if: ${{ always() && !cancelled() }}
    uses: $/.github/workflows/__codeql.yml
    permissions:
      contents: read
      security-events: write
    with:
      commit: ${{ github.event.pull_request.head.sha }}

  deploy:
    name: Deploy 🚀
    uses: $/.github/workflows/__deploy.yml
    if: ${{ always() && !cancelled() && github.repository == 'jellyfin/jellyfin-vue' && github.event_name == 'pull_request_target' }}
    needs:
      - push-comment
      - build
    permissions:
      contents: read
      deployments: write
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JF_BOT_TOKEN: ${{ secrets.JF_BOT_TOKEN }}
    with:
      # Fork branch names are attacker-controlled: use the PR number as the preview alias
      branch: ${{ github.event.pull_request.head.repo.full_name != github.repository && format('pr-{0}', github.event.pull_request.number) || github.event.pull_request.head.ref }}
      comment: true
      commit: ${{ github.event.pull_request.head.sha }}
