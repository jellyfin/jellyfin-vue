name: Quality checks 👌🧪

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
  workflow_dispatch:

permissions: {}

jobs:
  dependency-review:
    name: Vulnerable dependencies 🔎
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          show-progress: false
          persist-credentials: false
          # Untrusted fork code runs here: keep the caller's permissions and secrets minimal. See https://gh.io/securely-using-pull_request_target
          allow-unsafe-pr-checkout: true

      - name: Scan
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'master' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.ref }}

  quality:
    name: Run ${{ matrix.command }} 🕵️‍♂️
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - lint
          - test
          - check:types
          # Checks for dependency cycles in the bundle and in the monorepo setup
          - analyze:cycles
          - 'pnpm i --lockfile-only --config.disallow-workspace-cycles=true'

    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          show-progress: false
          persist-credentials: false
          # Untrusted fork code runs here: keep the caller's permissions and secrets minimal. See https://gh.io/securely-using-pull_request_target
          allow-unsafe-pr-checkout: true

      - name: Setup node environment ⚙️
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Install dependencies 📦
        run: corepack pnpm ci

      - name: Run ${{ matrix.command }} ⚙️
        run: corepack pnpm ${{ matrix.command }}

  commits_checks:
    name: Commit linting 💬✅
    runs-on: ubuntu-slim

    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          show-progress: false
          persist-credentials: false
          # Untrusted fork code runs here: keep the caller's permissions and secrets minimal. See https://gh.io/securely-using-pull_request_target
          allow-unsafe-pr-checkout: true

      - name: Check if all commits comply with the specification
        uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2

      - name: Check for merge commits
        run: |
          git log --merges --oneline | grep -q "^" && exit 1 || exit 0

  actionlint:
    name: GitHub Actions lint 🧹
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          show-progress: false
          persist-credentials: false
          # Untrusted fork code runs here: keep the caller's permissions and secrets minimal. See https://gh.io/securely-using-pull_request_target
          allow-unsafe-pr-checkout: true

      - name: Lint workflows 🔎
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  zizmor:
    name: GitHub Actions security 🌈
    # zizmor runs through Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          show-progress: false
          persist-credentials: false
          # Untrusted fork code runs here: keep the caller's permissions and secrets minimal. See https://gh.io/securely-using-pull_request_target
          allow-unsafe-pr-checkout: true

      - name: Audit workflows 🔎
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
